document.getElementById('cat').innerText=qq.c+" — Question "+(cur+1);
let ans=document.getElementById('answers');
ans.innerHTML="";
qq.a.forEach((t,i)=>{
let b=document.createElement('button');
b.className='btn';
b.innerText=t;
b.onclick=()=>check(i,b);
ans.appendChild(b);
});
document.getElementById('num').innerText=cur+1;
document.getElementById('bar').style.width=((cur+1)/totalQuestions*100)+"%";
document.getElementById('next').style.display='none';
// Entrée fluide
qBox.classList.remove('fade-out');
// 4. Lancement du compte à rebours de 20 secondes
startTimer();
}, 250);
}
function startTimer(){
clearInterval(timer);
timeLeft = 20;
document.getElementById('timer-bar').style.width = "100%";
document.getElementById('timer-bar').style.background = "#1ea362";
timer = setInterval(() => {
timeLeft--;
let percentage = (timeLeft / 20) * 100;
let tBar = document.getElementById('timer-bar');
tBar.style.width = percentage + "%";
// Alerte visuelle quand le temps devient court
if(timeLeft <= 7) {
tBar.style.background = "#e63946";
} else if(timeLeft <= 13) {
tBar.style.background = "#ffbe0b";
}
if(timeLeft <= 0){
clearInterval(timer);
timeOutAction();
}
}, 1000);
}
function timeOutAction(){
// Verrouiller les choix et afficher la bonne réponse
let qq=questions[cur];
document.querySelectorAll('.btn').forEach((b, index) => {
if(index === qq.r) {
b.style.background='#1ea362'; // affiche la bonne réponse en vert
} else {
b.style.background='rgba(230, 57, 70, 0.2)';
}
b.onclick = null;
});
document.getElementById('next').style.display='block';
if(cur===totalQuestions-1){document.getElementById('next').innerText='VOIR RESULTAT';}
}
function check(i,btn){
clearInterval(timer); // Arrête le chrono au clic
let qq=questions[cur];
if(i===qq.r){
btn.style.background='#1ea362';
score++;
} else {
btn.style.background='#e63946';
// Montrer aussi la bonne réponse en vert clair par fair-play
document.querySelectorAll('.btn')[qq.r].style.background='#1ea362';
}
document.getElementById('sc').innerText=score;
document.querySelectorAll('.btn').forEach(b=>b.onclick=null);
document.getElementById('next').style.display='block';
if(cur===totalQuestions-1){document.getElementById('next').innerText='VOIR RESULTAT';}
}
function nextQ(){
cur++;
if(cur<totalQuestions){
load();
} else {
clearInterval(timer);
let appreciation = 'Courage, révise !';
if(score >= 85) appreciation = 'Véritable Légende NMBU !! 👑';
else if(score >= 65) appreciation = 'Excellent Génie NMBU ! 🔥';
else if(score >= 45) appreciation = 'Pas mal, tu as la moyenne ! 👍';
document.querySelector('.question-box').innerHTML=`<h2 style='text-align:center; color:var(--warning); font-size:32px;'>Fin de la partie !</h2> <p style='text-align:center; font-size:26px; font-weight:bold;'>Score : ${score}/${totalQuestions}</p> <p style='text-align:center; font-size:18px; color:#ddd; padding:0 10px;'>${appreciation}</p> <button class='btn' style='background:var(--warning); color:black; font-weight:bold; text-align:center; margin-top:20px;' onclick='location.reload()'>RECOMMENCER LE DEFI</button>`;
}
}
function share(){
let text=`J'ai fait un score de ${score}/${totalQuestions} au Quiz Ultimate NMBU ! Viens tester tes connaissances ici : https://urichjames4-eng.github.io/Quiz-07-NMBU/`;
let url=`https://wa.me/?text=${encodeURIComponent(text)}`;
window.open(url);
}
// Lancement de l'application
load();
</script>
